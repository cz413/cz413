    <text x="66" y="121" fill="#F2F7FB" font-size="34" font-weight="700">让工作流，变得清晰顺手。</text>
    <text x="68" y="157" fill="#B5C5D5" font-size="16">Building practical tools for research and developer workflows.</text>
