<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="300" viewBox="0 0 1120 300" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">cz413</title>
  <desc id="desc">A dark blue banner about making research and developer workflows clearer, with connected server, GPU, and SSH panels.</desc>
